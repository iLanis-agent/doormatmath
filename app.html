<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doormat math - calculators</title>
<style>
  :root { --accent: #c19a6b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Georgia, 'Times New Roman', serif; background: #fbf9f5; color: #2f2b25; line-height: 1.55; }
  main { max-width: 1100px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-size: 2rem; margin: 0 0 8px; color: var(--accent); }
  .lede { margin: 0 0 28px; max-width: 640px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  section { background: #fff; border: 1px solid #e9dfd0; border-radius: 8px; padding: 20px 22px; }
  h2 { font-size: 1.15rem; margin: 0 0 6px; }
  .hint { font-size: 0.9rem; color: #7d7261; margin: 0 0 14px; }
  label { display: block; font-size: 0.9rem; margin: 10px 0 3px; }
  input { width: 100%; padding: 8px 10px; font-size: 1rem; border: 1px solid #d9cbae; border-radius: 5px; font-family: inherit; }
  button { margin-top: 16px; width: 100%; padding: 11px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; font-size: 1rem; cursor: pointer; font-family: inherit; }
  button:hover { filter: brightness(1.08); }
  .out { margin-top: 14px; font-size: 1rem; min-height: 1.4em; }
  .out.err { color: #a32222; }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; font-size: 0.85rem; color: #a1957f; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Doormat math</h1>
  <p class="lede">The mat that actually scrapes, the grit it stops and the hours it takes to dry. Exact arithmetic, every borrowed number labeled.</p>
  <div class="grid">
    <section>
      <h2>Size plan</h2>
      <p class="hint">A door becomes a mat.</p>
      <label for="s-door">Door width (cm)</label>
      <input id="s-door" type="number" value="90" min="0" step="5">
      <label for="s-extra">Extra width a side (cm)</label>
      <input id="s-extra" type="number" value="10" min="0" step="5">
      <label for="s-stride">Your stride (cm)</label>
      <input id="s-stride" type="number" value="65" min="0" step="5">
      <button id="s-go">Size the mat</button>
      <div class="out" id="s-out"></div>
    </section>
    <section>
      <h2>Grit plan</h2>
      <p class="hint">Footsteps become kilograms.</p>
      <label for="g-steps">Steps on the mat per visit</label>
      <input id="g-steps" type="number" value="4" min="0" step="1">
      <label for="g-visits">Visits per day</label>
      <input id="g-visits" type="number" value="3" min="0" step="1">
      <label for="g-grit">Grit per step (g)</label>
      <input id="g-grit" type="number" value="0.4" min="0" step="0.1">
      <button id="g-go">Count the grit</button>
      <div class="out" id="g-out"></div>
    </section>
    <section>
      <h2>Dry plan</h2>
      <p class="hint">A wet mat becomes hours.</p>
      <label for="d-l">Mat length (cm)</label>
      <input id="d-l" type="number" value="110" min="0" step="5">
      <label for="d-w">Mat width (cm)</label>
      <input id="d-w" type="number" value="130" min="0" step="5">
      <label for="d-soak">Soak (ml per m²)</label>
      <input id="d-soak" type="number" value="1000" min="0" step="100">
      <label for="d-evap">Drying rate (ml per hour)</label>
      <input id="d-evap" type="number" value="100" min="0" step="10">
      <button id="d-go">Time the drying</button>
      <div class="out" id="d-out"></div>
    </section>
  </div>
</main>
<footer>Built by the app factory. <a href="index.html">About</a> &middot; <a href="https://github.com/iLanis-agent/doormatmath">Source</a></footer>
<script src="engine.js"></script>
<script>
function num(id){ return parseFloat(document.getElementById(id).value); }
function show(id, r, render){
  var el = document.getElementById(id);
  if (r.error) { el.textContent = r.error; el.classList.add('err'); }
  else { el.textContent = render(r); el.classList.remove('err'); }
}
document.getElementById('s-go').addEventListener('click', function(){
  show('s-out', DoormatMath.sizePlan(num('s-door'),num('s-extra'),num('s-stride')), function(r){ return DoormatMath.renderSize(r, num('s-door'), num('s-extra'), num('s-stride')); });
});
document.getElementById('g-go').addEventListener('click', function(){
  show('g-out', DoormatMath.gritPlan(num('g-steps'),num('g-visits'),num('g-grit')), function(r){ return DoormatMath.renderGrit(r, num('g-steps'), num('g-visits'), num('g-grit')); });
});
document.getElementById('d-go').addEventListener('click', function(){
  show('d-out', DoormatMath.dryPlan(num('d-l'),num('d-w'),num('d-soak'),num('d-evap')), function(r){ return DoormatMath.renderDry(r, num('d-evap')); });
});
</script>
</body>
</html>
